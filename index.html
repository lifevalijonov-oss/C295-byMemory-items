<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0f13">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>C-295 Memory Items</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: строгий, лётный — как QRH в кабине, без украшений
   IDEA: карта «Emergency Procedures List»: пункт … точечная линия … ДЕЙСТВИЕ | член экипажа
   PICTURE: сама карта-тренажёр с закрываемыми действиями — она и есть главный экран
   COLOUR and TYPE: бумага/ночная кабина, красный WARNING, янтарный CAUTION, зелёный «знал»; Barlow Condensed + Barlow
   LAYOUT: шапка с режимами, выбор процедуры, большая карта; на телефоне — одна колонка */
:root{color-scheme:light dark;
--bg:light-dark(#eef0f2,#0c0f13);--card:light-dark(#ffffff,#151a20);--ink:light-dark(#14171a,#e6e9ec);
--mut:light-dark(#5d6670,#8f99a4);--line:light-dark(#d5dade,#2a323b);
--red:light-dark(#c8102e,#ff5257);--amb:light-dark(#a86a00,#ffb020);--ok:light-dark(#1f7a45,#3ccf7a);
--soft:light-dark(#f5f6f7,#1b2129);--hi:light-dark(#fff4d6,#2b2414)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.cond{font-family:"Barlow Condensed","Roboto Condensed",sans-serif-condensed,Barlow,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:calc(14px + env(safe-area-inset-top)) max(4vw,14px,env(safe-area-inset-right)) 0 max(4vw,14px,env(safe-area-inset-left))}
.top{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline;justify-content:space-between}
h1{margin:0;font-size:clamp(26px,4vw,36px);line-height:1.05;font-weight:700}
h1 b{color:var(--red)}
.stat{color:var(--mut);font-size:14px}
nav{display:flex;gap:4px;overflow-x:auto;margin-top:12px}
nav button{flex:none;border:0;background:none;color:var(--mut);font:600 17px "Barlow Condensed","Roboto Condensed",sans-serif-condensed,sans-serif;padding:10px 14px;min-height:44px;border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:var(--ink);border-bottom-color:var(--red)}
main{max-width:980px;margin:0 auto;padding:18px max(4vw,12px) 60px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
select,.btn,input{font:inherit;font-size:16px;min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px}
select{flex:1 1 260px;font-weight:600}
.btn{cursor:pointer;font-weight:600}
.btn.pri{background:var(--ink);color:var(--card);border-color:var(--ink)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.no{background:var(--red);color:#fff;border-color:var(--red)}
.btn:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid var(--amb);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ch{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.ch h2{margin:0;font-size:clamp(24px,3.4vw,32px);line-height:1.05;text-wrap:balance}
.grp{color:var(--mut);font-size:14px;margin-top:4px}
.trig{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.ann{font:700 14px "Barlow Condensed","Roboto Condensed",sans-serif-condensed,sans-serif;letter-spacing:.02em;padding:3px 8px;border:2px solid currentColor;border-radius:4px}
.ann.W{color:var(--red)}.ann.C{color:var(--amb)}
.tx{font-size:14px;color:var(--mut)}
.note{margin:10px 0 0;font-size:14px;color:var(--mut)}
.ph{font:600 17px "Barlow Condensed","Roboto Condensed",sans-serif-condensed,sans-serif;color:var(--red);padding:10px 18px 2px}
.row{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto 3.6em;gap:6px;align-items:baseline;padding:9px 18px;border-top:1px dashed var(--line);font:500 18px "Barlow Condensed","Roboto Condensed",sans-serif-condensed,sans-serif}
.row .n{color:var(--mut)}
.row .it{display:flex;gap:6px;align-items:baseline}
.row .it span{flex:none;max-width:100%}
.row .it i{flex:1;border-bottom:2px dotted var(--line);transform:translateY(-4px);min-width:12px}
.row .ac{font-weight:700;text-align:right}
.row .cr{text-align:right;font-weight:700}
.star{color:var(--red)}
.mask{background:var(--soft);color:transparent;border-radius:4px;user-select:none;cursor:pointer}
.mask::after{content:"?";color:var(--mut)}
.row.cur{background:var(--hi)}
.row.good .ac{color:var(--ok)}.row.bad .ac{color:var(--red)}
.foot{display:flex;flex-wrap:wrap;gap:8px;padding:14px 18px;border-top:1px solid var(--line);background:var(--soft)}
.foot .sp{flex:1}
.msg{padding:12px 18px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:14px 18px}
.chip{font:500 17px "Barlow Condensed","Roboto Condensed",sans-serif-condensed,sans-serif;text-align:left;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--soft);color:var(--ink);cursor:pointer;min-height:44px}
.chip.shake{animation:sh .3s;border-color:var(--red)}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.chip.shake{animation:none}}
.opts{display:grid;gap:8px;padding:14px 18px}
.opt{text-align:left;font:600 18px "Barlow Condensed","Roboto Condensed",sans-serif-condensed,sans-serif;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--soft);color:var(--ink);cursor:pointer;min-height:48px}
.opt.r{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.w{background:var(--red);color:#fff;border-color:var(--red)}
.wr{padding:10px 18px 14px;border-top:1px dashed var(--line)}
.wr .q{font:600 19px "Barlow Condensed","Roboto Condensed",sans-serif-condensed,sans-serif}
.wr .q .ph2{color:var(--red);font-size:15px;display:block}
.wr input{width:100%;margin:8px 0;text-transform:uppercase;font-family:"Barlow Condensed","Roboto Condensed",sans-serif-condensed,sans-serif;font-weight:600;font-size:19px}
.crew{display:flex;flex-wrap:wrap;gap:6px}
.crew button{min-width:52px;min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font:700 16px "Barlow Condensed","Roboto Condensed",sans-serif-condensed,sans-serif;cursor:pointer}
.crew button.on{background:var(--ink);color:var(--card)}
.res{margin-top:8px;font-weight:600}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left;color:var(--ink);font:inherit}
.li b{font:600 17px/1.15 "Barlow Condensed","Roboto Condensed",sans-serif-condensed,sans-serif;display:block}
.li small{color:var(--mut)}
.box{display:flex;gap:3px}.box i{width:8px;height:18px;border-radius:2px;background:var(--line)}.box i.f{background:var(--ok)}
.due{color:var(--red);font-weight:600}
.hint{color:var(--mut);font-size:14px;margin:12px 2px 0}
@media(max-width:600px){.row{grid-template-columns:1.8em minmax(0,1fr) 3em;font-size:17px}.row .ac{grid-column:2;text-align:left}.row .cr{grid-row:1;grid-column:3}.row .it i{display:none}.ph,.row,.ch,.foot,.chips,.opts,.wr,.msg{padding-left:12px;padding-right:12px}}
</style>
</head>
<body>
<header>
  <div class="top"><h1>C-295 · <b>Memory Items</b></h1><span class="stat" id="stat"></span></div>
  <nav id="nav">

</main>

const IV=[0,1,2,4,8,16];const DAY=864e5;
const st=id=>S[id]||(S[id]={b:0,d:0});
const isDue=id=>{const s=st(id);return s.b===0||Date.now()>=s.d};
function grade(id,ok){const s=st(id);s.b=ok?Math.min(5,s.b+1):1;s.d=Date.now()+IV[s.b]*DAY-36e5;save();stat()}
function queue(){return P.filter(p=>isDue(p.id)).sort((a,b)=>st(a.id).b-st(b.id).b||st(a.id).d-st(b.id).d)}
function stat(){const m=P.filter(p=>st(p.id).b>=4).length;document.getElementById('stat').textContent=`Выучено ${m} из ${P.length} · к повторению ${queue().length}`}

const sel=document.getElementById('sel'),view=document.getElementById('view'),bar=document.getElementById('bar');
let groups=[...new Set(P.map(p=>p.g))];
sel.innerHTML=groups.map(g=>`<optgroup label="${esc(g)}">`+P.filter(p=>p.g===g).map(p=>`<option value="${p.id}">${esc(p.t)}</option>`).join('')+'</optgroup>').join('');
let mode='queue',cur=P[0].id;

function head(p,showTrig=true){
 const tr=p.tr.map(([k,s])=>k===T?`<span class="tx">${esc(s)}</span>`:`<span class="ann ${k}">${esc(s)}</span>`).join('');
 return `<div class="ch"><h2>${esc(p.t)}</h2><div class="grp">${esc(p.g)} · ${esc(p.ru)} · ${p.steps.length} memory ${p.steps.length===1?'item':'items'}</div>${showTrig&&tr?`<div class="trig">${tr}</div>`:''}${p.note?`<p class="note">${esc(p.note)}</p>`:''}</div>`}
function rowH(s,i,opt={}){
 const hide=opt.hide&&s.ac!=='';
 return `<div class="row ${opt.cls||''}" data-i="${i}"><span class="n">${s.n}.</span><span class="it"><span>${esc(s.it)}</span><i></i></span><span class="ac ${hide?'mask':''}">${hide?'':esc(s.ac)}</span><span class="cr ${hide&&s.cr?'mask':''}">${hide&&s.cr?'':crewH(s.cr)}</span></div>`}
function rowsH(p,fn){let out='',last;p.steps.forEach((s,i)=>{const r=fn(s,i);if(!r)return;if(s.h!==last){last=s.h;if(s.h)out+=`<div class="ph">${esc(s.h)}</div>`}out+=r});return out}

const R={};
R.queue=()=>{bar.hidden=true;const q=queue();
 view.innerHTML=`<div class="bar"><button class="btn pri" id="go" ${q.length?'':'disabled'}>Начать повторение (${q.length})</button><span class="tx">Интервалы: 1 → 2 → 4 → 8 → 16 дней. Ошибка — карточка возвращается на 1 день.</span></div><div class="list">`+
 P.map(p=>{const s=st(p.id);return `<button class="li" data-id="${p.id}"><span><b>${esc(p.t)}</b><small>${esc(p.g)} · ${p.steps.length} шаг. ${isDue(p.id)?'<span class="due">· повторить</span>':''}</small></span><span class="box">${[1,2,3,4,5].map(k=>`<i class="${s.b>=k?'f':''}"></i>`).join('')}</span></button>`}).join('')+'</div>';
 view.querySelector('#go').onclick=()=>{cur=q[0].id;setMode('recall')};
 view.querySelectorAll('.li').forEach(b=>b.onclick=()=>{cur=b.dataset.id;setMode('study')})};
R.study=()=>{const p=byId[cur];let hide=false;
 const draw=()=>{view.innerHTML=`<div class="card">${head(p)}${rowsH(p,(s,i)=>rowH(s,i,{hide}))}<div class="foot"><button class="btn" id="hd">${hide?'Показать все действия':'Закрыть действия'}</button><span class="sp"></span><button class="btn pri" id="rc">Проверить себя →</button></div></div>`;
  view.querySelector('#hd').onclick=()=>{hide=!hide;draw()};view.querySelector('#rc').onclick=()=>setMode('recall');
  view.querySelectorAll('.mask').forEach(m=>m.onclick=()=>{const r=m.closest('.row'),s=p.steps[+r.dataset.i];r.outerHTML=rowH(s,+r.dataset.i)})};draw()};
R.recall=()=>{const p=byId[cur];let k=0,shown=false,bad=0;const res=[];
 const draw=()=>{const done=k>=p.steps.length;
  view.innerHTML=`<div class="card">${head(p)}${rowsH(p,(s,i)=>i<k?rowH(s,i,{cls:res[i]?'good':'bad'}):i===k&&shown?rowH(s,i,{cls:'cur'}):i===k?`<div class="row cur"><span class="n">${s.n}.</span><span class="it"><span class="tx">Назовите пункт, действие и кто выполняет</span></span><span></span><span></span></div>`:'')}
  ${done?`<div class="msg" style="color:var(${bad?'--red':'--ok'})">${bad?`Ошибок: ${bad} из ${p.steps.length}. Карточка вернётся завтра.`:'Без ошибок — интервал увеличен.'}</div>`:''}
  <div class="foot">${done?`<button class="btn" id="again">Ещё раз</button><span class="sp"></span><button class="btn pri" id="nx">Следующая по очереди →</button>`:shown?`<span class="tx">Честно: всё совпало, включая член экипажа и *?</span><span class="sp"></span><button class="btn no" id="n">Ошибся</button><button class="btn ok" id="y">Знал</button>`:`<span class="tx">Пробел — показать</span><span class="sp"></span><button class="btn pri" id="sh">Показать шаг ${p.steps[k].n}</button>`}</div></div>`;
  const b=id=>view.querySelector(id);
  if(done){grade(p.id,!bad);b('#again').onclick=R.recall;b('#nx').onclick=nextQ}
  else if(shown){b('#y').onclick=()=>{res[k]=1;k++;shown=false;draw()};b('#n').onclick=()=>{res[k]=0;bad++;k++;shown=false;draw()}}
  else b('#sh').onclick=()=>{shown=true;draw()}};
 R._key=e=>{if(e.key===' '&&mode==='recall'){const b=view.querySelector('#sh')||view.querySelector('#y');if(b){e.preventDefault();b.click()}}};draw()};
const norm=s=>s.toUpperCase().replace(/[º°]/g,'DEG').replace(/APPROX\w*/,'APPROX').replace(/[^A-Z0-9%]/g,'');
R.write=()=>{const p=byId[cur];let k=0,bad=0,crew='',star=false,checked=false,last='';
 const draw=()=>{const done=k>=p.steps.length,s=p.steps[k];
  let w='';
  if(!done&&s.ac===''){w=`<div class="wr"><div class="q">${s.h?`<span class="ph2">${esc(s.h)}</span>`:''}${s.n}. ${esc(s.it)}</div><div class="res tx">Этот шаг без действия — просто запомните формулировку.</div><button class="btn pri" id="ok2">Дальше</button></div>`}
  else if(!done){const crews=['1','2','1/2','ALL','PF','LM/2'];
   w=`<div class="wr"><div class="q">${s.h?`<span class="ph2">${esc(s.h)}</span>`:''}${s.n}. ${esc(s.it)} ……</div>
   <input id="in" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ДЕЙСТВИЕ" value="${esc(last)}" ${checked?'disabled':''}>
   <div class="crew">${crews.map(c=>`<button data-c="${c}" class="${crew===c?'on':''}">${c}</button>`).join('')}<button data-s="1" class="${star?'on':''}" aria-label="Звёздочка">*</button></div>
   ${checked?`<div class="res" id="rs"></div><button class="btn pri" id="ok2" style="margin-top:8px">Дальше</button>`:`<button class="btn pri" id="ck" style="margin-top:8px">Проверить</button>`}</div>`}
  view.innerHTML=`<div class="card">${head(p)}${rowsH(p,(t,i)=>i<k?rowH(t,i):'')}${done?`<div class="msg" style="color:var(${bad?'--red':'--ok'})">${bad?`Ошибок: ${bad}. Повторите ещё раз.`:'Всё написано верно!'}</div><div class="foot"><button class="btn" id="again">Ещё раз</button><span class="sp"></span><button class="btn pri" id="nx">Следующая по очереди →</button></div>`:w}</div>`;
  const b=id=>view.querySelector(id);
  if(done){grade(p.id,!bad);b('#again').onclick=R.write;b('#nx').onclick=nextQ;return}
  if(s.ac===''){b('#ok2').onclick=()=>{k++;draw()};return}
  const inp=b('#in');if(!checked){inp.focus();inp.oninput=()=>last=inp.value;inp.onkeydown=e=>{if(e.key==='Enter')b('#ck').click()}}
  view.querySelectorAll('.crew button').forEach(x=>x.onclick=()=>{if(checked)return;last=inp.value;if(x.dataset.s)star=!star;else crew=x.dataset.c;draw()});
  if(checked){const ok1=norm(last)===norm(s.ac),c2=(crew+(star?'*':''))===s.cr;const r=b('#rs');
   r.innerHTML=`${ok1?'✓':'✗'} Действие: <b>${esc(s.ac)}</b><br>${c2?'✓':'✗'} Экипаж: <b>${crewH(s.cr)}</b>`;r.style.color=`var(${ok1&&c2?'--ok':'--red'})`;
   if(!(ok1&&c2)&&!s._c){bad++;s._c=1}b('#ok2').onclick=()=>{delete s._c;k++;crew='';star=false;checked=false;last='';draw()};b('#ok2').focus()}
  else b('#ck').onclick=()=>{last=inp.value;checked=true;draw()}};draw()};
R.order=()=>{const p=byId[cur];let k=0,err=0;const pool=shuf(p.steps.map((s,i)=>i));
 const draw=()=>{const done=k>=p.steps.length;
  view.innerHTML=`<div class="card">${head(p)}${rowsH(p,(s,i)=>i<k?rowH(s,i):'')}${done?`<div class="msg" style="color:var(${err?'--red':'--ok'})">${err?`Неверных нажатий: ${err}`:'Порядок без ошибок!'}</div><div class="foot"><button class="btn" id="again">Ещё раз</button><span class="sp"></span><button class="btn pri" id="nx">Другая процедура →</button></div>`:`<div class="chips">${pool.filter(i=>i>=k).map(i=>{const s=p.steps[i];return `<button class="chip" data-i="${i}">${esc(s.it)}${s.ac?' — <b>'+esc(s.ac)+'</b>':''}</button>`}).join('')}</div><div class="foot"><span class="tx">Нажимайте шаги в правильном порядке</span></div>`}</div>`;
  if(done){view.querySelector('#again').onclick=R.order;view.querySelector('#nx').onclick=()=>{cur=shuf(P)[0].id;sel.value=cur;R.order()};return}
  view.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{const i=+c.dataset.i;const s=p.steps[i],t=p.steps[k];
   if(i===k||(s.it===t.it&&s.ac===t.ac)){if(i!==k){const a=pool.indexOf(i),b2=pool.indexOf(k);[pool[a],pool[b2]]=[pool[b2],pool[a]]}k++;draw()}else{err++;c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')}})};draw()};
R.scen=()=>{bar.hidden=true;const p=shuf(P)[0];const opts=shuf([p,...shuf(P.filter(x=>x!==p&&x.g!=='zz')).slice(0,3)]);
 const tr=p.tr.map(([k,s])=>k===T?`<span class="tx">${esc(s)}</span>`:`<span class="ann ${k}">${esc(s)}</span>`).join('');
 view.innerHTML=`<div class="card"><div class="ch"><h2>Что происходит?</h2><div class="grp">Ситуация: ${esc(p.ru)}</div>${tr?`<div class="trig">${tr}</div>`:''}</div><div class="opts">${opts.map(o=>`<button class="opt" data-id="${o.id}">${esc(o.t)}</button>`).join('')}</div><div class="foot" id="ft"><span class="tx">Выберите процедуру, затем выполните memory items</span></div></div>`;
 view.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{view.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.id===p.id)x.classList.add('r')});if(b.dataset.id!==p.id)b.classList.add('w');
  const f=view.querySelector('#ft');f.innerHTML=`<button class="btn" id="ns">Следующая ситуация</button><span class="sp"></span><button class="btn pri" id="dr">Вспомнить действия →</button>`;
  f.querySelector('#ns').onclick=R.scen;f.querySelector('#dr').onclick=()=>{cur=p.id;setMode('recall')}})};
R.quiz=()=>{bar.hidden=true;const all=P.flatMap(p=>p.steps.filter(s=>s.ac).map(s=>({p,s})));const {p,s}=shuf(all)[0];
 const askCrew=Math.random()<.35;let opts,right;
 if(askCrew){right=s.cr;opts=shuf([right,...shuf(['1','2','2*','1/2','ALL','PF','LM/2'].filter(c=>c!==right)).slice(0,3)])}
 else{right=s.ac;const pool=[...new Set(all.map(x=>x.s.ac))].filter(a=>a!==right);opts=shuf([right,...shuf(pool).slice(0,3)])}
 view.innerHTML=`<div class="card"><div class="ch"><div class="grp">${esc(p.t)}${s.h?' · '+esc(s.h):''}</div><h2>${s.n}. ${esc(s.it)} → ${askCrew?'кто выполняет?':'?'}</h2>${askCrew?`<div class="grp">Действие: ${esc(s.ac)}</div>`:''}</div><div class="opts">${opts.map(o=>`<button class="opt" data-v="${esc(o)}">${askCrew?crewH(o):esc(o)}</button>`).join('')}</div><div class="foot" id="ft"><span class="tx" id="sc"></span><span class="sp"></span><button class="btn pri" id="nq">Следующий вопрос →</button></div></div>`;
 view.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=b.dataset.v===right;R.qs=R.qs||{n:0,ok:0};R.qs.n++;if(ok)R.qs.ok++;
  view.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.v===right)x.classList.add('r')});if(!ok)b.classList.add('w');
  view.querySelector('#sc').textContent=`Счёт: ${R.qs.ok} / ${R.qs.n}`});
 view.querySelector('#nq').onclick=R.quiz};

function nextQ(){const q=queue();cur=(q[0]||shuf(P)[0]).id;sel.value=cur;R[mode]()}
function setMode(m){mode=m;try{history.replaceState(null,'','#'+m)}catch(e){}
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
 bar.hidden=!['study','recall','write','order'].includes(m);sel.value=cur;R[m]();window.scrollTo(0,0)}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
sel.onchange=()=>{cur=sel.value;R[mode]()};
document.getElementById('rnd').onclick=()=>{cur=shuf(P.filter(p=>p.id!==cur))[0].id;sel.value=cur;R[mode]()};
document.getElementById('nxt').onclick=nextQ;
document.addEventListener('keydown',e=>{if(R._key&&e.target.tagName!=='INPUT')R._key(e)});
try{const A=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.App;if(A)A.addListener('backButton',()=>{if(mode!=='queue')setMode('queue');else A.exitApp()})}catch(e){}
const h=location.hash.slice(1);stat();setMode(R[h]&&h!=='_key'&&h!=='qs'?h:'queue');
}
</script>
</body>
